version: 2
project_name: parel

before:
  hooks:
    - go mod tidy

builds:
  - id: parel
    main: ./cmd/parel
    binary: parel
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/parel-cloud/parel-cli/internal/cmd.version={{.Version}}
      - -X github.com/parel-cloud/parel-cli/internal/cmd.commit={{.Commit}}
      - -X github.com/parel-cloud/parel-cli/internal/cmd.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Drop windows/arm64 for v0.1; revisit when there's user demand.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "SHA256SUMS"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# v0.1 ships unsigned macOS binaries (PAR-24 in progress). install.sh runs
# `xattr -d com.apple.quarantine` after extraction, and a brew post_install
# does the same. v0.1.1 will add Apple Developer signing + notarization once
# PAR-24 lands. Windows code signing is intentionally deferred to v0.2.

brews:
  - name: parel
    repository:
      owner: parel-cloud
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://parel.cloud
    description: Parel CLI - single binary for the Parel AI gateway
    license: MIT
    install: |
      bin.install "parel"
    post_install: |
      # Apple Gatekeeper bypass for v0.1 unsigned builds. Will become a no-op
      # once we ship notarized binaries in v0.1.1+.
      system "/usr/bin/xattr", "-d", "com.apple.quarantine", "#{bin}/parel" rescue nil
    test: |
      system "#{bin}/parel", "version"

scoops:
  - name: parel
    repository:
      owner: parel-cloud
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://parel.cloud
    description: Parel CLI - single binary for the Parel AI gateway
    license: MIT

release:
  github:
    owner: parel-cloud
    name: parel-cli
  prerelease: auto
  draft: false
  name_template: "v{{ .Version }}"
  header: |
    ## Parel CLI {{ .Tag }}

    Single binary for the Parel AI gateway. Mac, Linux, Windows.

    ### Install

    ```bash
    # macOS / Linux
    brew install parel-cloud/tap/parel
    # or:
    curl -fsSL https://parel.cloud/install.sh | sh

    # Windows
    scoop bucket add parel-cloud https://github.com/parel-cloud/scoop-bucket
    scoop install parel
    # or:
    iwr -useb https://parel.cloud/install.ps1 | iex
    ```

    ### Quickstart

    ```bash
    parel auth login
    parel claude-code init
    parel proxy --port 7878
    ```
  footer: |
    > **macOS note (v0.1):** Binaries are not yet Apple-notarized. The
    > installer scripts and brew formula clear the quarantine attribute
    > automatically. Notarized builds land in v0.1.1.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore: tidy"
      - "^docs:"
      - "merge "
